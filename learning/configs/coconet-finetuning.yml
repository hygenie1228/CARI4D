lr: 0.001 #0.0001
c_in: 6 # xyz + mask (3 channel, with full obj mask included)
zfar: 'Infinity'
debug: 2

symm_loss: false
batch_size: 4
num_workers: 4

# loss weights for finetuning
w_rot: 1.0       # Object delta rotation loss weight (rot vs delta-rot GT)
w_transl: 1.0    # Object delta translation loss weight (trans vs delta-trans GT)
w_abs_rot: 0.0   # Object absolute rotation loss weight (rot_abs vs abs-rot GT)
w_hum_rot: 1.0   # Human pose rotation loss weight
w_hum_t: 1.0     # Human translation loss weight
w_hum_j: 2.0     # Human joint position loss weight
w_hum_b: 0.1     # Human shape (betas) loss weight
w_hum_velo: 0.0  # Human temporal velocity regularization weight
w_obj_velo: 1.0  # Object temporal velocity regularization weight
w_contact: 0.1   # Contact prediction loss weight

# w_rot: 0.1       # Object delta rotation loss weight (rot vs delta-rot GT)
# w_transl: 1.0    # Object delta translation loss weight (trans vs delta-trans GT)
# w_abs_rot: 0.1   # Object absolute rotation loss weight (rot_abs vs abs-rot GT)
# w_abs_trans: 0.1 # Object absolute translation loss weight (used by abs-trans loss types)
# lw_acc: 0.0      # Temporal acceleration consistency loss weight
# w_hum_rot: 0.1   # Human pose rotation loss weight
# w_hum_t: 0.1     # Human translation loss weight
# w_hum_j: 0.0     # Human joint position loss weight
# w_hum_b: 0.0     # Human shape (betas) loss weight
# w_hum_velo: 0.0  # Human temporal velocity regularization weight
# w_obj_velo: 0.0  # Object temporal velocity regularization weight
# w_contact: 0.0   # Contact prediction loss weight
# w_diff_l2: 10.0  # Diffusion branch L2 loss weight (for diffusion training modes)
# w_heatmap: 0.0   # Contact heatmap loss weight (if heatmap supervision is enabled)

n_view: 1
run_id: null
use_BN: true
rot_rep: 6d
exp_name: cari4d-release
config: "learning/configs/chair-dinoxx.yml"
model_name: "HORefine"
embed_dim_spatial_temporal: 512 # 768 will be OOM with bs=8
posi_len: 256 # positional encoding length
use_fp_pretrained: false
add_ho_mask: true  # add Human object massk to the depth xyz map
pose_init_type: copy-first #random-keyframes
feat_dim_6dpose: 1024
feat_dim_mask: 16
loss_abs_trans_rela: true
abspose_posi_encode: true
bnorm_mask: true
dropout: 0.05
dropout_1st: 0 
pred_head_attn: false 
mixed_spatial_temporal: true
num_attn_layers: 2 
cont_out_dim: 2 
pred_shape: true
merge_strategy: learned
merge_factor: 0.0 
window: 6
train_smpl_only: false
fp_err_dim: -1
input_fp_2nd: false
input_gtpose_2nd: false
attn_activation: gelu
pred_head_dims:
  - 512
  - 256
  - 128

save_dir: experiments
loss_type: l1-absrot-delta-hum # predict both abs and delta
optimizer: adam

lr_scheduler:
  type: 'transformers'
  kwargs:
    name: 'linear'
    num_warmup_steps: 0
    num_training_steps: 250000 # this is for single GPU, actual steps will be scaled by num_gpus

# lr_scheduler:
#   type: 'cosine' # options: cosine, cosine_with_restarts, transformers, torch
#   kwargs:
#     num_warmup_steps: 0
#     num_training_steps: 250000 # this is for single GPU, actual steps will be scaled by num_gpus
#     num_cycles: 0.5 # cosine default (half-wave). Increase for more oscillations.

# data format
trans_rep: tracknet
crop_ratio: 1.2
use_normal: false
BN_momentum: 0.1
max_num_key: null
warmup_step: -1
input_resize:
- 224
- 224
subtract_transl: true
mask_rgb_bkg: true
obj_pose_dim_input: 6 # rot 6d
mask_dino_type: dinov2_vits14
mask_encode_type: hum-obj-fullobj

# for evaluation
max_step_val: 10
val_step_interval: 250
ckpt_interval: 200
num_epochs: 5000
vis_every_n_steps: 250
val_at_start: false

normal_uint8: false
vis_interval: 1000
weight_decay: 0
normalize_xyz: true
clip_grad_norm: 'Infinity'
rot_normalizer: 0.3490658503988659 # this should be the same for train and test time
trans_normalizer:
- 0.5
- 0.5
- 0.5
val_epoch_interval: 10


split_file: 'splits/behave+hodome.json'
exclude_frames: 'splits/behave-30fps-exclude.json'
render_root: 'outputs/foundpose_train/behave-fp-aligned-dmap'
rgb_root: 'data/behave/30fps/h5-full-dmap'
nlf_root: 'data/behave/nlf-smplh-2unidepth-v2'
fp_root: 'data/behave/fp-unidepth-jump-all-aligned-refine'